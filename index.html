<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록 (Todo App)</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-box input { flex: 1; padding: 8px; }
        .input-box button { padding: 8px 12px; background: #007bff; color: white; border: none; cursor: pointer; }
        .todo-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>📝 할 일 목록 (2-Tier 실습)</h2>
    
    <div class="input-box">
        <input type="text" id="todo-input" placeholder="새로운 할 일 입력...">
        <button onclick="addTodo()">추가</button>
    </div>

    <div id="todo-list"></div>

    <script>
        // 💡 실습 환경의 WAS 서버 IP 또는 도메인 주소로 변경하세요.
        const WAS_API_URL = 'http://210.109.53.7:5000/api/todos';

        // 1. 목록 조회 (GET)
        function loadTodos() {
            fetch(WAS_API_URL)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('todo-list');
                    list.innerHTML = '';
                    data.forEach(todo => {
                        const div = document.createElement('div');
                        div.className = 'todo-item';
                        div.innerHTML = `
                            <span>${todo.title}</span>
                            <button class="delete-btn" onclick="deleteTodo(${todo.id})">삭제</button>
                        `;
                        list.appendChild(div);
                    });
                }).catch(err => console.error("조회 실패:", err));
        }

        // 2. 할 일 추가 (POST)
        function addTodo() {
            const input = document.getElementById('todo-input');
            if (!input.value.trim()) return;

            fetch(WAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            })
            .then(res => res.json())
            .then(() => { input.value = ''; loadTodos(); })
            .catch(err => console.error("추가 실패:", err));
        }

        // 3. 할 일 삭제 (DELETE)
        function deleteTodo(id) {
            fetch(`${WAS_API_URL}/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadTodos())
                .catch(err => console.error("삭제 실패:", err));
        }

        window.onload = loadTodos;
    </script>
</body>
</html>
